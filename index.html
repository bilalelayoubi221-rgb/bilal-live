<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم المباريات - KoraStream</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .form-container { max-width: 500px; margin: 0 auto; background: #2a2a2a; padding: 20px; border-radius: 8px; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: none; box-sizing: border-box; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>إضافة مباراة جديدة</h2>
        <form id="addMatchForm">
            <input type="text" id="team1" placeholder="الفريق الأول (مثل: ريال مدريد)" required>
            <input type="text" id="team2" placeholder="الفريق الثاني (مثل: برشلونة)" required>
            <input type="time" id="matchTime" required>
            <input type="text" id="streamUrl" placeholder="رابط البث (Stream URL)" required>
            <button type="submit">حفظ المباراة</button>
        </form>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- ملف الإعدادات الخاص بك -->
    <script src="./KoraStream-Admin"></script> 

    <script>
      // 1. تهيئة Firebase و Firestore
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      // 2. الاستماع عند الضغط على زر الحفظ
      document.getElementById('addMatchForm').addEventListener('submit', function(e) {
          e.preventDefault();

          const homeTeam = document.getElementById('team1').value;
          const awayTeam = document.getElementById('team2').value;
          const time = document.getElementById('matchTime').value;
          const streamUrl = document.getElementById('streamUrl').value;

          // 3. حفظ البيانات في Firestore
          db.collection("matches").add({
              homeTeam: homeTeam,
              awayTeam: awayTeam,
              time: time,
              streamUrl: streamUrl,
              status: "live",
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
          })
          .then(() => {
              alert("تمت إضافة المباراة بنجاح!");
              document.getElementById('addMatchForm').reset();
          })
          .catch((error) => {
              alert("حدث خطأ أثناء الحفظ: " + error.message);
          });
      });
    </script>
</body>
</html>
